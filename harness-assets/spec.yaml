id: 2
from: v0.10.3
to: v0.11.2
tasks:
  - id: 1
    spec: 2
    request: '三個畫面，一個畫面一課：[M]ove 看與移動、[A]ctions 找動作、[P]opups popup 疊 popup；按 M、A、P 換畫面，啟動時打開 [M]ove'
    tdp: [tdp terms.2, tdp screen.1, tdp screen.3, tdp screen.5, tdp screen.8, tdp panel.5, tdp P5, tdp M4, tdp M5, tdp K12, tdp L1, tdp L4]
    remark:
      - '畫面 chip 列上三個畫面；M、A、P 是領域熱鍵（tdp P5），不佔移動的字母（tdp K12）'
      - '一個畫面練一部分操作，三個畫面共用同一個書架（README 的特色）'
      - '60 欄時 [M]ove 的 [1] SHELVES 22 欄、[2] BOOKS 38 欄並排，[A]ctions、[P]opups 各一個 panel（tdp L1：60×32 所有 panel 並排）；窄寬的門檻 60，是 tdp screen.5 的上限'
  - id: 2
    spec: 1
    request: '書架上是二十本經典，每次啟動都一樣；它什麼都不存，不碰使用者的任何檔案'
    tdp: [tdp P5, tdp E3, tdp E7]
    remark:
      - '書是寫死的假資料，沒有隨機的東西，每次啟動都一樣（tdp P5：功能邏輯）'
      - '不存東西：tdp E3 的設定、狀態、資料、快取的位置都沒有用到，README 的「設定與資料」照樣寫明'
  - id: 3
    spec: 1
    request: '[M]ove：書架與書架上的書，書那邊有 Authors tab；j|k 換書架，Tab、1–9 換 panel，h|l 切 tab，gg|G 到頭尾，走過最後一個回到第一個'
    tdp: [tdp K1, tdp K2, tdp K12, tdp terms.4, tdp panel.1, tdp panel.4, tdp panel.5, tdp panel.13, tdp screen.8]
    remark:
      - '兩個 panel：書架的清單、那個書架的書；書那個 panel 有 tab，其中一個是 Authors'
  - id: 4
    spec: 2
    request: 'Enter 做最直觀的那件事：打開那本書的第一頁；在作者上打開那個作者'
    tdp: [tdp K3, tdp P5, tdp M6, tdp panel.13, tdp note.1, tdp note.2, tdp note.3, tdp note.7, tdp components.3, tdp T1]
    remark:
      - 'Enter 的動作是 app 自己定的（tdp P5、tdp K3）：同一種項目在三個畫面都是打開第一頁'
      - '第一頁與作者是唯讀內容，用 viewer（tdp note）'
  - id: 5
    spec: 1
    request: '在一頁文字上：按 v、移到起點，再按 v、移動選取；y 複製'
    tdp: [tdp note.4]
  - id: 6
    spec: 1
    request: '[A]ctions：Space 看這裡能做什麼（對這一項、對這個 panel、對整個 app），? 看這裡能按的每一個鍵'
    tdp: [tdp K5, tdp K6, tdp M2, tdp M3, tdp M4, tdp M5, tdp M6, tdp menu, tdp note.5]
    remark:
      - '書的動作 open、begin、finish、sort 都在 Space menu 找得到，熱鍵用 [] 標出（tdp M3、tdp M5）'
  - id: 7
    spec: 1
    request: '[A]ctions 上按 b 開始讀（移到 Reading）、按 f 讀完（移到 Done）'
    tdp: [tdp P5, tdp M3, tdp M5, tdp M6, tdp M7, tdp K12, tdp note.7, tdp toast.2]
    remark:
      - 'b、f 是領域熱鍵（tdp P5），在 Space menu 裡是 begin、finish'
  - id: 8
    spec: 1
    request: '[A]ctions 上按 s 按年份排，再按一次回到按書名'
    tdp: [tdp P5, tdp M5, tdp panel.6, tdp note.7, tdp toast.2]
    remark:
      - 's 是領域熱鍵（tdp P5），在 Space menu 裡是 sort'
  - id: 9
    spec: 2
    request: '! 打開 App Log：做過的事，最新的在最下面；在這裡是換過的畫面、打開過的第一頁與作者，以及搬、拿掉、加進來、排序過的書'
    tdp: [tdp K1, tdp F5, tdp M1, tdp P3, tdp note.7, tdp toast.2]
    remark:
      - '記什麼照 tdp note.7（DM41 回報後 tdp v0.11.0 定的）：tdp P3 的三種 operation 都記，只看不改的也記（打開第一頁、作者）；換畫面由 lib 記'
      - '不記的（tdp note.7）：移動 cursor（j|k 換書架，明細跟著換）、換 focus（[1] SHELVES 上的 Enter 只把 focus 移到 [2]）、Space menu、?、!、在 confirm 或表單按 Esc 取消的動作'
      - '打開與排序記 Info，改到書架的記 Success（tdp toast.2：做完的事用哪一種，app 可以自行決定）'
  - id: 10
    spec: 1
    request: '[P]opups 上按 r 把書拿掉，先問'
    tdp: [tdp P5, tdp M5, tdp F6, tdp confirm, tdp T1, tdp note.7, tdp toast.2]
    remark:
      - 'r 是領域熱鍵（tdp P5），Space menu 裡也拿得掉'
  - id: 11
    spec: 1
    request: '[P]opups 上按 n 加一本書：NEW BOOK 表單，表單上疊一個 select；Esc 一次關一層'
    tdp: [tdp P5, tdp M5, tdp form, tdp text, tdp select, tdp popup.1, tdp input.1, tdp input.2, tdp input.5, tdp input.10, tdp K3, tdp K4, tdp F8, tdp T1, tdp note.7, tdp toast.2]
    remark:
      - '表單上開 select，是 popup 疊 popup 的那一課：上層開著時下層淡化（tdp F8），Esc 一次關一層（tdp K4）'
      - '從 Space menu 打開時，取消回到 menu，加好了一起關（tdp T1）'
  - id: 12
    spec: 1
    request: 'q 離開，先問'
    tdp: [tdp K9, tdp F6, tdp confirm]
  - id: 13
    spec: 2
    request: '終端機比 60×24 小時只顯示 demou 的名稱、需要的大小與怎麼離開，拉大就回到原來的樣子'
    tdp: [tdp L1, tdp screen.7, tdp E5]
    remark:
      - '最低尺寸 60×24：tdp L1 放行 app 調低（不能高於 60×32）。寬用標準的 60；高沿用 24，新開的終端機常是 80×24（user 定 80×24 時的理由，DM39），demou 的版面在 60×24 畫得下'
  - id: 14
    spec: 1
    request: 'demou version 印出版號（-v、--version），demou help 印出命令列的用法（-h、--help）'
    tdp: [tdp E1, tdp project.4, tdp project/version.go]
  - id: 15
    spec: 1
    request: 'demou 的 mark：docs/icon.svg'
    tdp: [tdp S1, tdp S2, tdp S3, tdp S4, tdp S5, tdp E6]
    remark:
      - 'splash 畫 demou 的 mark；README 不寫 splash（tdp S2）'
  - id: 16
    spec: 1
    request: '啟動時量 icon 與 powerline 符號佔幾格，量錯時用 DEMOU__、TERMINU__、LC_TERMINU_ 的環境變數設'
    tdp: [tdp E2, tdp E5, tdp E8]
  - id: 17
    spec: 1
    request: '用 Homebrew、安裝腳本（裝到 ~/.local/bin，不用 sudo）或 go install 裝，用 brew 或移除腳本移除；只有 macOS 與 Linux，要 Nerd Font 與 truecolor'
    tdp: [tdp E4, tdp E6, tdp project.2, tdp project.3, tdp project.7, tdp project/family.mk, tdp project/release.yml, tdp project/goreleaser.yaml, tdp project/install.sh, tdp project/uninstall.sh]
    remark:
      - '只出 linux、darwin：goreleaser 範本的 Windows 那幾行不打開（tdp project.2）'
